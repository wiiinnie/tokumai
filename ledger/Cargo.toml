[package]
name = "scrai-ledger"
version.workspace = true
edition = "2021"
description = "tokumai shared 'guest book' ledger — the seed-recoverable, cross-server value layer (redeemed session credit). Runs as a portless, mixnet-reachable service over a hardened local SQLite; the chat servers reach it via MixnetLedger. Only the INFREQUENT ops live here (credit/status/balance); per-message billing stays local. See docs/federation-shared-ledger.md."

[dependencies]
scrai-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# Local, bundled SQLite — no system dependency, no network listener.
rusqlite = { version = "0.32", features = ["bundled"] }
# Member-key request signing (the crypto ACL that replaces a network ACL).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
# block_on for the sync tests that drive the async Ledger/Transport methods.
futures = "0.3"
