[package]
name = "scrai-server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone workspace: cargo-fuzz builds this crate with -Zsanitizer=address on nightly,
# which must not leak into the main workspace's profiles.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
once_cell = "1"
scrai-server = { path = ".." }
scrai-core = { path = "../../core" }

[[bin]]
name = "fed_dispatch"
path = "fuzz_targets/fed_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_reserve"
path = "fuzz_targets/chat_reserve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_handle"
path = "fuzz_targets/upload_handle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replies_handle"
path = "fuzz_targets/replies_handle.rs"
test = false
doc = false
bench = false
