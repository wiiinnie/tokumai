<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>tokumai — finish your top-up</title>
<meta name="description" content="Finish a tokumai top-up that was started in the app.">
<style>
  :root{
    --ink:#141210; --surface:#1C1917; --surface-2:#262220; --line:#332E2A; --bone:#ECE6DC; --muted:#9C938A;
    --acc:#7A5FFF; --acc2:#B9A3FF; --ok:#3FC98A; --warn:#E4642A;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif; --display:Fraunces,Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);
       display:flex;justify-content:center;padding:28px 18px 60px}
  .wrap{width:100%;max-width:560px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:26px}
  .logo b{color:var(--acc);font-weight:600}
  h1{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
  .lead{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
  .amt{font-family:var(--display);font-weight:700;font-size:30px}
  .amt span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 5px}
  .lbl.acc{color:var(--acc)}
  .val{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--surface-2);
       border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:center}
  .val.memo{border-color:var(--acc);color:var(--acc2);font-size:15px;letter-spacing:.05em}
  .val code{flex:1;font:inherit;color:inherit;background:none}
  .cp{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--mono);
      font-size:10.5px;padding:5px 9px;border-radius:7px;cursor:pointer}
  .cp:hover{border-color:var(--acc);color:var(--bone)}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:var(--body);font-size:15px;
       font-weight:600;padding:14px 18px;border-radius:11px;border:1px solid var(--acc);
       background:var(--acc);color:#141210;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .note{font-size:12.5px;line-height:1.55;color:var(--muted);margin-top:14px}
  .bad{border-color:var(--warn)} .bad h1{color:var(--warn)}
  /* buying a code here (no invoice in the link) */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:6px}
  .tile{border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--bone);
        font:inherit;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
  .tile b{font-size:16px}
  .tile span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .tile.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface-2))}
  .rail{display:flex;width:100%;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;
        background:var(--surface-2);color:var(--bone);font:inherit;padding:11px 13px;margin-bottom:7px;cursor:pointer}
  .rail.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface-2))}
  .rail .rn{flex:1;text-align:left;font-weight:600;font-size:14px}
  .rail .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .rail{position:relative} .rail .ribbon{position:absolute;top:-8px;right:10px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--acc);border-radius:999px;padding:3px 9px}
  .tile.dis{opacity:.4;pointer-events:none} .tile.dis span{color:var(--muted)}
  .ck{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
      background:var(--surface-2);padding:10px 12px;margin-bottom:7px;font-size:12.5px;line-height:1.5;cursor:pointer}
  .ck.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--surface-2))}
  .ck input{margin:2px 0 0;accent-color:var(--acc)}
  .go{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid var(--acc);
      background:var(--acc);color:#fff;font:inherit;font-weight:600;font-size:15px;border-radius:12px;
      padding:13px;margin-top:12px;cursor:pointer}
  .go[disabled]{opacity:.4;cursor:not-allowed}
  .fine{font-size:12px;line-height:1.55;color:var(--muted);margin:12px 0 10px}
  .fine.c{text-align:center;font-family:var(--mono);font-size:10.5px;margin-top:7px}
  .fine.warn{border-left:2px solid var(--warn);padding-left:10px;color:var(--muted)}
  /* Losing this tab loses the code, and only a refund can follow. That is worth a colour. */
  .fine.danger{color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
               border-radius:10px;background:color-mix(in srgb,var(--warn) 8%,transparent);padding:10px 12px}
  .fine.danger b{color:var(--warn)}
  .fine.warn b,.fine b{color:var(--bone)}
  .watch{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
         color:var(--ok);margin-top:14px}
  .watch .wd{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;
             animation:wpulse 1.6s ease-in-out infinite}
  @keyframes wpulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.watch .wd{animation:none}}
  .cancel{display:block;width:100%;background:none;border:0;color:var(--muted);font:inherit;
          font-size:12.5px;padding:8px 0 0;cursor:pointer;text-decoration:underline}
  .cancel:hover{color:var(--bone)}
  .code{display:flex;gap:8px;align-items:center;border:1px dashed var(--acc);border-radius:12px;
        background:color-mix(in srgb,var(--acc) 8%,var(--surface-2));padding:14px;margin:4px 0 14px}
  .code code{flex:1;font-family:var(--mono);font-size:19px;letter-spacing:.05em;word-break:break-all}
  .foot{margin-top:26px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span>tokum<b>ai</b></span></div>
  <div id="out"></div>
  <div class="foot">Nothing on this page identifies you ·
    <a href="https://tokumai.com/">tokumai.com</a></div>
</div>
<script>
(function(){
  "use strict";
  // The invoice arrives in the URL FRAGMENT, never the query string: a fragment is not
  // sent to the server, so the address, amount and memo stay off our logs entirely.
  //
  // It is also completely attacker-controlled — anyone can craft a link to this page.
  // Nothing here is trusted: every value is escaped into the DOM, lengths are capped,
  // and the only clickable link (the card checkout) must be an https URL on checkout.stripe.com,
  // exactly the check the app and the server already make. Without that this page would
  // be a redirector on our own domain, which is a phishing primitive.
  var out = document.getElementById("out");
  // Escapes for BOTH contexts, text and attribute. The old textContent/innerHTML trick
  // escapes & < > but NOT quotes, and this page interpolates fragment-controlled values
  // into data-copy="..." and href="..." — a value carrying a double quote broke out of
  // the attribute and ran script on our own payment domain (audit 2026-09-06).
  var ESCMAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"'`]/g, function(c){ return ESCMAP[c]; }); };
  var MAX = 200;
  var clean = function(s){ return typeof s === "string" ? s.slice(0, MAX) : ""; };
  // The host must match EXACTLY. Mollie's guard accepted any *.mollie.com; Stripe's
  // checkout lives on one host, so there is no reason to accept a family of them — and a
  // suffix test is how "checkout.stripe.com.attacker.net" gets clicked.
  var isStripe = function(u){
    if (typeof u !== "string" || u.length > 500) return false;
    var rest = u.indexOf("https://") === 0 ? u.slice(8) : null;
    if (rest === null) return false;
    if (/[\s<>"'\\]/.test(u)) return false;
    var host = rest.split("/")[0];
    return host === "checkout.stripe.com";
  };

  // The "raising the invoice" ticker. Declared out here, not inside buyFlow, because
  // fail() is out here and every terminal screen has to be able to stop it.
  var rclock = null;
  function stopRaise(){ if (rclock) { clearInterval(rclock); rclock = null; } }
  function fail(title, body){
    stopRaise();
    out.innerHTML = '<div class="card bad"><h1>' + esc(title) + '</h1><p class="lead" style="margin:0">' + esc(body) + '</p></div>';
  }

  function decode(frag){
    // base64url -> UTF-8 JSON
    var b = frag.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function row(label, value, cls){
    return '<div class="lbl' + (cls === "memo" ? " acc" : "") + '">' + esc(label) + '</div>' +
           '<div class="val' + (cls === "memo" ? " memo" : "") + '"><code>' + esc(value) + '</code>' +
           '<button class="cp" type="button" data-copy="' + esc(value) + '">copy</button></div>';
  }

  // Delegated, and attached BEFORE either flow runs: the buy flow returns early, so a
  // listener wired at the end of the invoice branch would never exist for it.
  out.addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]");
    if (!b) return;
    var v = b.getAttribute("data-copy");
    var done = function(){ var t = b.textContent; b.textContent = "copied"; setTimeout(function(){ b.textContent = t; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, function(){});
    else { var ta = document.createElement("textarea"); ta.value = v; document.body.appendChild(ta); ta.select();
           try { document.execCommand("copy"); done(); } catch (err) {} document.body.removeChild(ta); }
  });

  var frag = (location.hash || "").replace(/^#/, "");
  if (!frag) {
    // No invoice in the link: this is somebody buying a code here rather than paying an
    // invoice the app already raised. Different flow, same page — see docs/vouchers.md.
    buyFlow("");
    return;
  }
  if (/^order=/.test(frag)) { buyFlow(frag); return; }
  var inv;
  try { inv = decode(frag); } catch (e) { inv = null; }
  if (!inv || typeof inv !== "object" || inv.v !== 1) {
    fail("That link is not readable", "It may have been cut short. Go back to the app and open it again.");
    return;
  }

  var usd = Number(inv.usd) || 0;
  var toku = Number(inv.toku) || 0;
  var exp = Number(inv.exp) || 0;
  if (exp && exp < Date.now()) {
    fail("This invoice has expired", "Raise a fresh one in the app \u2014 nothing was charged.");
    return;
  }

  var head = '<div class="card"><div class="amt">$' + esc(usd.toFixed(2)) +
             '<span>' + esc(toku.toLocaleString("en-US")) + ' TOKU</span></div>';

  if (inv.rail === "card") {
    if (!isStripe(inv.checkout)) {
      fail("That checkout link is not valid", "Only Stripe's own checkout is accepted here. Raise the payment again in the app.");
      return;
    }
    out.innerHTML = head +
      '<p class="lead" style="margin:14px 0 18px">You will finish the payment on Stripe\u2019s own checkout page. ' +
      'Stripe asks for your name and billing address and sees your card and IP for the payment itself \u2014 never your tokumai account and never what you ask.</p>' +
      '<a class="btn" id="go" href="' + esc(inv.checkout) + '" rel="noopener">Continue to Stripe</a>' +
      '<p class="note">The credit appears in the app on its own, usually within seconds of paying. ' +
      'You can close this page once the payment went through.</p></div>';
    return;
  }

  var o = (Array.isArray(inv.opts) ? inv.opts : [])[0];
  if (!o || typeof o !== "object") {
    fail("That link is incomplete", "Go back to the app and open it again.");
    return;
  }
  var amount = clean(o.amount), cur = clean(o.currency), dest = clean(o.destination), memo = clean(o.memo);
  if (!dest) {
    fail("That link is incomplete", "No payment address was handed over. Raise the payment again in the app.");
    return;
  }
  var html = head +
    '<p class="lead" style="margin:14px 0 4px">Send exactly this amount from your wallet.' +
    (memo ? ' <b>The memo is required</b> \u2014 without it the payment cannot be credited.' : '') + '</p>';
  if (amount) html += row("Amount", amount + (cur ? " " + cur : ""), "");
  html += row("Address", dest, "");
  if (memo) html += row("Memo \u2014 required", memo, "memo");
  html += '<p class="note">The credit lands in the app by itself, usually under a minute after the ' +
          'transfer is seen on chain. It shows up as \u201cheld\u201d and is spent as blind-signed coins.</p></div>';
  out.innerHTML = html;



  // ---- buying a code here ------------------------------------------------------------
  //
  // Nothing on this page knows an account: the payout is a voucher code, which the buyer
  // carries into an app. So there is no top-up ID to fill in and nothing to identify.
  function buyFlow(frag){
    var TIERS = [5, 10, 20, 50];
    var CONSENT = "2026-09-07";          // must match docs/consent/<version>.md
    // The default rail is the first one this server actually serves — "nyx" as a constant
    // meant the page opened on a dead rail the moment coin payments went away.
    var pick = 10, rail = null, c1 = false, c2 = false, order = null, timer = null, clock = null;
    // Coins are cheaper by this much — a lower PRICE for the same credit, because a coin
    // payment cannot be charged back. Server-set; 0 means no difference.
    var COIN_OFF = Math.max(0, Math.min(50, Number("{{COIN_DISCOUNT_PCT}}") || 0));
    // Cards sell the larger tiles only (fee + chargeback exposure) — same floor the server enforces.
    var CARD_MIN = Math.max(0, Number("{{CARD_MIN_USD}}") || 10);
    // Which rails this server can actually raise an invoice on, filled in by pay_html().
    // A rail that is not listed is not offered at all — not greyed, not "soon": coin
    // payments were withdrawn on 2026-09-16 with no date to come back, and a tile that
    // says "not yet" would be a promise nobody has made.
    var RAILS = "{{RAILS}}".split(",").filter(function(r){ return /^[a-z]+$/.test(r); });
    if (!RAILS.length) RAILS = ["card"];
    var hasRail = function(r){ return RAILS.indexOf(r) !== -1; };
    rail = hasRail("card") ? "card" : RAILS[0];
    if (rail === "card" && pick < CARD_MIN) pick = CARD_MIN;
    function priceOf(n){ return rail === "card" ? n : Math.round(n * (100 - COIN_OFF)) / 100; }
    function money(x){ return "$" + (Number.isInteger(x) ? x : x.toFixed(2)); }

    function tile(n){
      var p = priceOf(n), off = COIN_OFF > 0 && rail !== "card", small = rail === "card" && n < CARD_MIN;
      return '<button type="button" class="tile' + (n === pick ? " sel" : "") + (small ? " dis" : "") + '" data-tier="' + n + '">' +
             '<b>' + money(p) + '</b><span>' + (n * 100000).toLocaleString("en-US") + ' TOKU' + (small ? ' \u00b7 coins only' : (off ? ' \u00b7 $' + n + ' by card' : '')) + '</span></button>';
    }
    function railRow(id, name, tag, ribbon){
      return '<button type="button" class="rail' + (id === rail ? " sel" : "") + '" data-rail="' + id + '">' +
             '<span class="rn">' + esc(name) + '</span><span class="rt">' + esc(tag) + '</span>' +
             (ribbon ? '<span class="ribbon">' + esc(ribbon) + '</span>' : '') + '</button>';
    }
    function draw(){
      var ready = c1 && c2;
      out.innerHTML =
        '<div class="card"><h1>Buy a code</h1>' +
        '<p class="lead">Prepaid credit, redeemed in the tokumai app. Nothing here asks who you are — ' +
        'you get a code, not an account.</p>' +
        '<div class="tiles">' + TIERS.map(tile).join("") + '</div>' +
        '<div class="lbl">Pay with</div>' +
        (hasRail("nyx") ? railRow("nyx", "NYM", "native \u00b7 Nyx", COIN_OFF > 0 ? "\u2212" + COIN_OFF + "% \u00b7 coins cost less" : "") : "") +
        (hasRail("card") ? railRow("card", "Card \u00b7 PayPal \u00b7 Apple Pay \u00b7 Google Pay", "Stripe") : "") +
        '<p class="fine">Sold under our <a href="/terms">Terms</a>. Please read the ' +
        '<a href="/terms#withdrawal">right of withdrawal</a> and the <a href="/privacy">privacy notice</a> first. ' +
        'An <b>unredeemed</b> code can be refunded; once redeemed it cannot.</p>' +
        '<label class="ck' + (c1 ? " on" : "") + '"><input type="checkbox" id="k1"' + (c1 ? " checked" : "") + '>' +
        '<span>I ask you to <b>start delivering the credit immediately</b>, before the 14-day withdrawal period ends.</span></label>' +
        '<label class="ck' + (c2 ? " on" : "") + '"><input type="checkbox" id="k2"' + (c2 ? " checked" : "") + '>' +
        '<span>I understand that I <b>lose my right of withdrawal</b> once the code has been issued.</span></label>' +
        '<button class="go" type="button" id="go"' + (ready ? "" : " disabled") + '>Buy now \u2014 ' + money(priceOf(pick)) + (rail === "card" ? "" : " in NYM") + '</button>' +
        (ready ? "" : '<p class="fine c">tick both boxes to continue</p>') +
        '</div>';
      [].forEach.call(out.querySelectorAll("[data-tier]"), function(b){
        b.onclick = function(){ pick = +b.getAttribute("data-tier"); draw(); };
      });
      [].forEach.call(out.querySelectorAll("[data-rail]"), function(b){
        b.onclick = function(){ rail = b.getAttribute("data-rail"); if(rail === "card" && pick < CARD_MIN) pick = CARD_MIN; draw(); };
      });
      var k1 = document.getElementById("k1"), k2 = document.getElementById("k2");
      if (k1) k1.onchange = function(){ c1 = k1.checked; draw(); };
      if (k2) k2.onchange = function(){ c2 = k2.checked; draw(); };
      var go = document.getElementById("go");
      if (go) go.onclick = start;
    }
    function start(){
      // Not the mixnet: a web order is raised on the server itself. The wait is the pickup
      // beat (one second) plus whatever the payment rail takes to answer — normally under
      // two seconds all in. It still gets a live row rather than a frozen line: a static
      // "please wait" is indistinguishable from a hung page, and this is the moment a buyer
      // is least willing to give the benefit of the doubt.
      raiseAt = Date.now();
      out.innerHTML = '<div class="card"><h1>Raising the invoice\u2026</h1>' +
        '<p class="lead">Preparing your payment details. This usually takes a second or two ' +
        '\u2014 please keep this tab open.</p>' +
        '<div class="watch"><span class="wd"></span><span id="rtx">starting\u2026</span></div></div>';
      rclock = setInterval(tickRaise, 1000);
      fetch("/api/order", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ usd: pick, method: rail,
          consent: { version: CONSENT, immediateStart: true, waiverAck: true } }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.id) { fail("That did not work", (j && j.error) || "Please try again."); return; }
          order = j.id;
          // Into the FRAGMENT, so a reload resumes instead of losing a raised invoice — and a
          // fragment is never sent to the server, so the id stays out of the logs.
          try { history.replaceState(null, "", "#order=" + order); } catch (e) {}
          // Tight while there is nothing to show yet, calmer once the details are up:
          // the first stretch is somebody staring at a spinner.
          timer = setInterval(poll, 900);
          clock = setInterval(tickWatch, 1000);
          poll();
        })
        .catch(function(){ fail("No connection", "Check your network and try again."); });
    }
    function poll(){
      fetch("/api/order?id=" + encodeURIComponent(order))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j) return;
          if (j.state === "error") {
            clearInterval(timer); clearInterval(clock);
            if (j.error === "cancelled") { cancelled(); return; }
            fail("That did not work", j.error || "");
            return;
          }
          if (j.state === "pay") { lastPoll = Date.now(); showPay(j.pay); return; }
          if (j.state === "paid") { clearInterval(timer); clearInterval(clock); reveal(); return; }
        })
        .catch(function(){ /* a dropped poll is not an error; the next one tries again */ });
    }
    var lastPoll = 0, paying = false, raiseAt = 0;
    // The raising row, in the same shape as the payment watch row below: a dot, what is
    // happening, and how long it has been happening. It escalates rather than repeating
    // itself — after six seconds something IS slow, and saying so is better than a spinner
    // that has meant the same thing since the first second.
    function tickRaise(){
      var el = document.getElementById("rtx");
      if (!el) { stopRaise(); return; }
      var s = Math.round((Date.now() - raiseAt) / 1000);
      el.textContent = s < 6 ? "asking the payment provider \u00b7 " + s + "s"
                     : s < 30 ? "the payment provider is slower than usual \u00b7 " + s + "s"
                     : "still waiting \u00b7 " + s + "s \u00b7 nothing has been charged";
    }
    function showPay(p){
      if (!p) return;
      stopRaise();
      // Rendered once — a re-render on every poll would blow away a half-made selection and
      // reset the copy buttons under the reader's finger.
      if (!paying) {
        paying = true;
        // Details are on screen now; polling can drop back to a chain-sized pace.
        clearInterval(timer);
        timer = setInterval(poll, 2500);
        // The card option carries a checkout link and no address — an empty "CARD" box with a
        // copy button explained nothing (2026-09-11). Address rows only for rails that have one.
        var opts = (p.options || []).filter(function(o){ return String(o.destination || "").length > 0; }).map(function(o){
          var m = String(o.memo || "");
          // The memo is not decoration: a Nyx transfer without it CANNOT be credited, which
          // is why it gets its own labelled row rather than sitting inside the address.
          return row(esc(o.method || "pay to"), String(o.destination || ""), "") +
                 (m ? row("Memo \u2014 required", m, "memo") : "");
        }).join("");
        var checkout = p.checkout || (p.options && p.options[0] && p.options[0].checkout) || "";
        out.innerHTML = '<div class="card"><h1>Pay $' + pick + '</h1>' +
          '<p class="lead">' + esc(p.instruction || "") + '</p>' + opts +
          (checkout && isStripe(checkout)
            ? '<p class="lead">Card, PayPal, Apple Pay or Google Pay, processed by Stripe. The checkout opens in a new tab; ' +
              'this page keeps waiting and shows your code the moment the payment is confirmed.</p>' +
              '<a class="go" href="' + esc(checkout) + '" target="_blank" rel="noopener">Open the checkout \u2192</a>' : "") +
          '<div class="watch"><span class="wd"></span><span id="wtx">checking\u2026</span></div>' +
          '<p class="fine danger">Your code appears here by itself. <b>Do not close this tab</b> \u2014 ' +
          'the code is shown once and cannot be sent to you afterwards.</p>' +
          '<button class="cancel" type="button" id="cx">Cancel this purchase</button>' +
          '</div>';
        var cx = document.getElementById("cx");
        if (cx) cx.onclick = cancel;
      }
      tickWatch();
    }
    // Same shape as the app's live row, so the two read alike: a dot, what it is doing, and
    // when it last managed to do it.
    function tickWatch(){
      var el = document.getElementById("wtx");
      if (!el) return;
      var ago = lastPoll ? Math.round((Date.now() - lastPoll) / 1000) : 0;
      el.textContent = "Live \u00b7 waiting for your payment \u00b7 last checked " +
        (ago < 2 ? "just now" : ago + "s ago");
    }
    function cancel(){
      clearInterval(timer); clearInterval(clock);
      // Tell the server too. Without this the invoice stayed open until it expired and the
      // chain watcher went on polling it for hours.
      fetch("/api/order/cancel", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: order }) }).catch(function(){});
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      cancelled();
    }
    function cancelled(){
      out.innerHTML = '<div class="card"><h1>Cancelled</h1>' +
        '<p class="lead">Nothing was charged. If you already sent the payment, it still ' +
        'arrives \u2014 write to us with the memo and we will issue your code.</p>' +
        '<button class="go" type="button" id="again">Buy a code</button></div>';
      var a = document.getElementById("again");
      if (a) a.onclick = function(){ order = null; paying = false; draw(); };
    }
    // Two polls can be in flight at once on a slow connection, and both can come back
    // "paid". Without this guard both call reveal(): the second one loses the race, gets
    // the "already issued" answer, and renders its failure OVER the code the first one had
    // just put on screen (audit 2026-09-08).
    var revealed = false;
    function reveal(){
      if (revealed) return;
      revealed = true;
      fetch("/api/order/code", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: order }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.code) {
            revealed = false;
            fail("Paid, but the code cannot be shown", (j && j.error) ||
              "Contact us with your receipt and we will sort it out.");
            return;
          }
          showCode(j.code, j.toku || 0);
        })
        .catch(function(){
          revealed = false;
          // True now, and it was not before: the code is held for half an hour, so a
          // reload really does bring it back. Telling someone to reload used to be the
          // fastest way to confirm they had lost it.
          fail("No connection", "Reload this page \u2014 your code is held for 30 minutes and will be shown again.");
        });
    }
    function showCode(code, toku){
      out.innerHTML = '<div class="card"><h1>Paid \u2014 here is your code</h1>' +
        '<div class="code"><code id="vc">' + esc(code) + '</code>' +
        '<button class="cp" type="button" data-copy="' + esc(code) + '">copy</button></div>' +
        '<p class="lead">' + toku.toLocaleString("en-US") + ' TOKU \u00b7 one use. ' +
        'In the app: <b>Buy credit \u2192 Redeem a code</b>.</p>' +
        '<div id="ackbox"><p class="fine warn"><b>Write it down or copy it now.</b> Reloading this ' +
        'page shows it again for the next 30 minutes. Anyone holding it can redeem it, so treat ' +
        'it like cash.</p>' +
        '<button class="cancel" type="button" id="ackb">I have written it down \u2014 delete your copy</button></div>' +
        '</div>';
      var b = document.getElementById("ackb");
      if (b) b.onclick = function(){ ack(); };
    }
    // The buyer's word is what ends the holding window. Pressing this is the moment the
    // page's promise becomes true, so it says plainly what it did.
    function ack(){
      var box = document.getElementById("ackbox");
      if (box) box.innerHTML = '<p class="fine">forgetting our copy\u2026</p>';
      fetch("/api/order/ack", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: order }) })
        .then(function(){
          if (box) box.innerHTML = '<p class="fine danger"><b>Done \u2014 our copy is gone.</b> ' +
            'This code now exists only on your screen. We keep a fingerprint of it, never the ' +
            'code itself, so we cannot show or recover it.</p>';
        })
        .catch(function(){
          if (box) box.innerHTML = '<p class="fine warn">That did not reach us \u2014 our copy is ' +
            'still held and will be deleted automatically within 30 minutes.</p>';
        });
    }
    // A reload lands here with #order=… — pick the order back up rather than starting over
    // on top of an invoice that is already raised.
    var resume = /^order=([A-Za-z0-9]{8,64})$/.exec(frag || "");
    if (resume) {
      order = resume[1];
      // Same live row as a fresh raise: on a reload this screen can sit here for a moment
      // too, and a bare heading with nothing moving is the one thing a buyer reads as
      // "it broke".
      raiseAt = Date.now();
      out.innerHTML = '<div class="card"><h1>Picking your order back up\u2026</h1>' +
        '<p class="lead">Your invoice is still there \u2014 fetching it.</p>' +
        '<div class="watch"><span class="wd"></span><span id="rtx">starting\u2026</span></div></div>';
      rclock = setInterval(tickRaise, 1000);
      timer = setInterval(poll, 900);
      clock = setInterval(tickWatch, 1000);
      poll();
      return;
    }
    draw();
  }

})();
</script>
</body>
</html>
