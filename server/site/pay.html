<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>tokumai — finish your top-up</title>
<meta name="description" content="Finish a tokumai top-up that was started in the app.">
<style>
  :root{
    --ink:#141210; --surface:#1C1917; --surface-2:#262220; --line:#332E2A; --bone:#ECE6DC; --muted:#9C938A;
    --acc:#7A5FFF; --acc2:#B9A3FF; --ok:#3FC98A; --warn:#E4642A;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif; --display:Fraunces,Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);
       display:flex;justify-content:center;padding:28px 18px 60px}
  .wrap{width:100%;max-width:560px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:26px}
  .logo b{color:var(--acc);font-weight:600}
  h1{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px}
  .lead{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
  .amt{font-family:var(--display);font-weight:700;font-size:30px}
  .amt span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 5px}
  .lbl.acc{color:var(--acc)}
  .val{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--surface-2);
       border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:center}
  .val.memo{border-color:var(--acc);color:var(--acc2);font-size:15px;letter-spacing:.05em}
  .val code{flex:1;font:inherit;color:inherit;background:none}
  .cp{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--mono);
      font-size:10.5px;padding:5px 9px;border-radius:7px;cursor:pointer}
  .cp:hover{border-color:var(--acc);color:var(--bone)}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:var(--body);font-size:15px;
       font-weight:600;padding:14px 18px;border-radius:11px;border:1px solid var(--acc);
       background:var(--acc);color:#141210;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .note{font-size:12.5px;line-height:1.55;color:var(--muted);margin-top:14px}
  .bad{border-color:var(--warn)} .bad h1{color:var(--warn)}
  /* buying a code here (no invoice in the link) */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:6px}
  .tile{border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--bone);
        font:inherit;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
  .tile b{font-size:16px}
  .tile span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .tile.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface-2))}
  .rail{display:flex;width:100%;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;
        background:var(--surface-2);color:var(--bone);font:inherit;padding:11px 13px;margin-bottom:7px;cursor:pointer}
  .rail.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface-2))}
  .rail .rn{flex:1;text-align:left;font-weight:600;font-size:14px}
  .rail .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .ck{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
      background:var(--surface-2);padding:10px 12px;margin-bottom:7px;font-size:12.5px;line-height:1.5;cursor:pointer}
  .ck.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--surface-2))}
  .ck input{margin:2px 0 0;accent-color:var(--acc)}
  .go{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid var(--acc);
      background:var(--acc);color:#fff;font:inherit;font-weight:600;font-size:15px;border-radius:12px;
      padding:13px;margin-top:12px;cursor:pointer}
  .go[disabled]{opacity:.4;cursor:not-allowed}
  .fine{font-size:12px;line-height:1.55;color:var(--muted);margin:12px 0 10px}
  .fine.c{text-align:center;font-family:var(--mono);font-size:10.5px;margin-top:7px}
  .fine.warn{border-left:2px solid var(--warn);padding-left:10px;color:var(--muted)}
  .fine.warn b,.fine b{color:var(--bone)}
  .code{display:flex;gap:8px;align-items:center;border:1px dashed var(--acc);border-radius:12px;
        background:color-mix(in srgb,var(--acc) 8%,var(--surface-2));padding:14px;margin:4px 0 14px}
  .code code{flex:1;font-family:var(--mono);font-size:19px;letter-spacing:.05em;word-break:break-all}
  .foot{margin-top:26px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span>tokum<b>ai</b></span></div>
  <div id="out"></div>
  <div class="foot">Started in the app · nothing on this page identifies you ·
    <a href="https://tokumai.com/">tokumai.com</a></div>
</div>
<script>
(function(){
  "use strict";
  // The invoice arrives in the URL FRAGMENT, never the query string: a fragment is not
  // sent to the server, so the address, amount and memo stay off our logs entirely.
  //
  // It is also completely attacker-controlled — anyone can craft a link to this page.
  // Nothing here is trusted: every value is escaped into the DOM, lengths are capped,
  // and the only clickable link (the card checkout) must be an https URL on mollie.com,
  // exactly the check the app and the server already make. Without that this page would
  // be a redirector on our own domain, which is a phishing primitive.
  var out = document.getElementById("out");
  // Escapes for BOTH contexts, text and attribute. The old textContent/innerHTML trick
  // escapes & < > but NOT quotes, and this page interpolates fragment-controlled values
  // into data-copy="..." and href="..." — a value carrying a double quote broke out of
  // the attribute and ran script on our own payment domain (audit 2026-09-06).
  var ESCMAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"'`]/g, function(c){ return ESCMAP[c]; }); };
  var MAX = 200;
  var clean = function(s){ return typeof s === "string" ? s.slice(0, MAX) : ""; };
  var isMollie = function(u){
    if (typeof u !== "string" || u.length > 500) return false;
    var rest = u.indexOf("https://") === 0 ? u.slice(8) : null;
    if (rest === null) return false;
    if (/[\s<>"'\\]/.test(u)) return false;
    var host = rest.split("/")[0];
    return host === "mollie.com" || /\.mollie\.com$/.test(host);
  };

  function fail(title, body){
    out.innerHTML = '<div class="card bad"><h1>' + esc(title) + '</h1><p class="lead" style="margin:0">' + esc(body) + '</p></div>';
  }

  function decode(frag){
    // base64url -> UTF-8 JSON
    var b = frag.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function row(label, value, cls){
    return '<div class="lbl' + (cls === "memo" ? " acc" : "") + '">' + esc(label) + '</div>' +
           '<div class="val' + (cls === "memo" ? " memo" : "") + '"><code>' + esc(value) + '</code>' +
           '<button class="cp" type="button" data-copy="' + esc(value) + '">copy</button></div>';
  }

  // Delegated, and attached BEFORE either flow runs: the buy flow returns early, so a
  // listener wired at the end of the invoice branch would never exist for it.
  out.addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]");
    if (!b) return;
    var v = b.getAttribute("data-copy");
    var done = function(){ var t = b.textContent; b.textContent = "copied"; setTimeout(function(){ b.textContent = t; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, function(){});
    else { var ta = document.createElement("textarea"); ta.value = v; document.body.appendChild(ta); ta.select();
           try { document.execCommand("copy"); done(); } catch (err) {} document.body.removeChild(ta); }
  });

  var frag = (location.hash || "").replace(/^#/, "");
  if (!frag) {
    // No invoice in the link: this is somebody buying a code here rather than paying an
    // invoice the app already raised. Different flow, same page — see docs/vouchers.md.
    buyFlow();
    return;
  }
  var inv;
  try { inv = decode(frag); } catch (e) { inv = null; }
  if (!inv || typeof inv !== "object" || inv.v !== 1) {
    fail("That link is not readable", "It may have been cut short. Go back to the app and open it again.");
    return;
  }

  var usd = Number(inv.usd) || 0;
  var toku = Number(inv.toku) || 0;
  var exp = Number(inv.exp) || 0;
  if (exp && exp < Date.now()) {
    fail("This invoice has expired", "Raise a fresh one in the app \u2014 nothing was charged.");
    return;
  }

  var head = '<div class="card"><div class="amt">$' + esc(usd.toFixed(2)) +
             '<span>' + esc(toku.toLocaleString("en-US")) + ' TOKU</span></div>';

  if (inv.rail === "card") {
    if (!isMollie(inv.checkout)) {
      fail("That checkout link is not valid", "Only Mollie's own checkout is accepted here. Raise the payment again in the app.");
      return;
    }
    out.innerHTML = head +
      '<p class="lead" style="margin:14px 0 18px">You will finish the payment on Mollie\u2019s own checkout page. ' +
      'Mollie sees your name, card and IP for the payment itself \u2014 never your tokumai account and never what you ask.</p>' +
      '<a class="btn" id="go" href="' + esc(inv.checkout) + '" rel="noopener">Continue to Mollie</a>' +
      '<p class="note">The credit appears in the app on its own, usually within seconds of paying. ' +
      'You can close this page once the payment went through.</p></div>';
    return;
  }

  var o = (Array.isArray(inv.opts) ? inv.opts : [])[0];
  if (!o || typeof o !== "object") {
    fail("That link is incomplete", "Go back to the app and open it again.");
    return;
  }
  var amount = clean(o.amount), cur = clean(o.currency), dest = clean(o.destination), memo = clean(o.memo);
  if (!dest) {
    fail("That link is incomplete", "No payment address was handed over. Raise the payment again in the app.");
    return;
  }
  var html = head +
    '<p class="lead" style="margin:14px 0 4px">Send exactly this amount from your wallet.' +
    (memo ? ' <b>The memo is required</b> \u2014 without it the payment cannot be credited.' : '') + '</p>';
  if (amount) html += row("Amount", amount + (cur ? " " + cur : ""), "");
  html += row("Address", dest, "");
  if (memo) html += row("Memo \u2014 required", memo, "memo");
  html += '<p class="note">The credit lands in the app by itself, usually under a minute after the ' +
          'transfer is seen on chain. It shows up as \u201cheld\u201d and is spent as blind-signed coins.</p></div>';
  out.innerHTML = html;



  // ---- buying a code here ------------------------------------------------------------
  //
  // Nothing on this page knows an account: the payout is a voucher code, which the buyer
  // carries into an app. So there is no top-up ID to fill in and nothing to identify.
  function buyFlow(){
    var TIERS = [5, 10, 20, 50];
    var CONSENT = "2026-09-07";          // must match docs/consent/<version>.md
    var pick = 10, rail = "nyx", c1 = false, c2 = false, order = null, timer = null;

    function tile(n){
      return '<button type="button" class="tile' + (n === pick ? " sel" : "") + '" data-tier="' + n + '">' +
             '<b>$' + n + '</b><span>' + (n * 100000).toLocaleString("en-US") + ' TOKU</span></button>';
    }
    function railRow(id, name, tag){
      return '<button type="button" class="rail' + (id === rail ? " sel" : "") + '" data-rail="' + id + '">' +
             '<span class="rn">' + esc(name) + '</span><span class="rt">' + esc(tag) + '</span></button>';
    }
    function draw(){
      var ready = c1 && c2;
      out.innerHTML =
        '<div class="card"><h1>Buy a code</h1>' +
        '<p class="lead">Prepaid credit, redeemed in the tokumai app. Nothing here asks who you are — ' +
        'you get a code, not an account.</p>' +
        '<div class="tiles">' + TIERS.map(tile).join("") + '</div>' +
        '<div class="lbl">Pay with</div>' +
        railRow("nyx", "NYM", "native \u00b7 Nyx") +
        railRow("card", "Card \u00b7 Apple Pay \u00b7 Google Pay", "Mollie") +
        '<p class="fine">Sold under our <a href="/terms">Terms</a>. Please read the ' +
        '<a href="/terms#withdrawal">right of withdrawal</a> and the <a href="/privacy">privacy notice</a> first. ' +
        'An <b>unredeemed</b> code can be refunded; once redeemed it cannot.</p>' +
        '<label class="ck' + (c1 ? " on" : "") + '"><input type="checkbox" id="k1"' + (c1 ? " checked" : "") + '>' +
        '<span>I ask you to <b>start delivering the credit immediately</b>, before the 14-day withdrawal period ends.</span></label>' +
        '<label class="ck' + (c2 ? " on" : "") + '"><input type="checkbox" id="k2"' + (c2 ? " checked" : "") + '>' +
        '<span>I understand that I <b>lose my right of withdrawal</b> once the code has been issued.</span></label>' +
        '<button class="go" type="button" id="go"' + (ready ? "" : " disabled") + '>Buy now \u2014 $' + pick + '</button>' +
        (ready ? "" : '<p class="fine c">tick both boxes to continue</p>') +
        '</div>';
      [].forEach.call(out.querySelectorAll("[data-tier]"), function(b){
        b.onclick = function(){ pick = +b.getAttribute("data-tier"); draw(); };
      });
      [].forEach.call(out.querySelectorAll("[data-rail]"), function(b){
        b.onclick = function(){ rail = b.getAttribute("data-rail"); draw(); };
      });
      var k1 = document.getElementById("k1"), k2 = document.getElementById("k2");
      if (k1) k1.onchange = function(){ c1 = k1.checked; draw(); };
      if (k2) k2.onchange = function(){ c2 = k2.checked; draw(); };
      var go = document.getElementById("go");
      if (go) go.onclick = start;
    }
    function start(){
      out.innerHTML = '<div class="card"><h1>Raising the invoice\u2026</h1>' +
        '<p class="lead">This goes through the mixnet, so it takes a few seconds.</p></div>';
      fetch("/api/order", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ usd: pick, method: rail,
          consent: { version: CONSENT, immediateStart: true, waiverAck: true } }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.id) { fail("That did not work", (j && j.error) || "Please try again."); return; }
          order = j.id;
          timer = setInterval(poll, 2500);
          poll();
        })
        .catch(function(){ fail("No connection", "Check your network and try again."); });
    }
    function poll(){
      fetch("/api/order?id=" + encodeURIComponent(order))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j) return;
          if (j.state === "error") { clearInterval(timer); fail("That did not work", j.error || ""); return; }
          if (j.state === "pay") { showPay(j.pay); return; }
          if (j.state === "paid") { clearInterval(timer); reveal(); return; }
        })
        .catch(function(){ /* a dropped poll is not an error; the next one tries again */ });
    }
    function showPay(p){
      if (!p) return;
      var opts = (p.options || []).map(function(o){
        return row(esc(o.method || "pay to"), String(o.destination || ""), "");
      }).join("");
      var checkout = p.checkout || (p.options && p.options[0] && p.options[0].checkout) || "";
      out.innerHTML = '<div class="card"><h1>Pay $' + pick + '</h1>' +
        '<p class="lead">' + esc(p.instruction || "") + '</p>' + opts +
        (checkout && /^https:\/\/([a-z0-9-]+\.)*mollie\.com\//.test(checkout)
          ? '<a class="go" href="' + esc(checkout) + '">Open the checkout \u2192</a>' : "") +
        '<p class="fine">This page keeps checking. When the payment lands, your code appears here \u2014 ' +
        '<b>do not close this tab</b>.</p></div>';
    }
    function reveal(){
      fetch("/api/order/code", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: order }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j || !j.code) {
            fail("Paid, but the code cannot be shown", (j && j.error) ||
              "Contact us with your receipt and we will sort it out.");
            return;
          }
          out.innerHTML = '<div class="card"><h1>Paid \u2014 here is your code</h1>' +
            '<div class="code"><code id="vc">' + esc(j.code) + '</code>' +
            '<button class="cp" type="button" data-copy="' + esc(j.code) + '">copy</button></div>' +
            '<p class="lead">' + (j.toku || 0).toLocaleString("en-US") + ' TOKU \u00b7 one use. ' +
            'In the app: <b>Buy credit \u2192 Redeem a code</b>.</p>' +
            '<p class="fine warn"><b>Write it down before you close this.</b> We cannot show it again \u2014 ' +
            'we keep only a fingerprint of it, never the code itself. Anyone holding it can redeem it, ' +
            'so treat it like cash.</p></div>';
        })
        .catch(function(){ fail("No connection", "Reload this page \u2014 the code is still waiting."); });
    }
    draw();
  }

})();
</script>
</body>
</html>
