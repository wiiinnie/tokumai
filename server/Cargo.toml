[package]
name = "scrai-server"
version = "0.1.0"
edition = "2021"
description = "ScrambleAI server — the mixnet service provider + t-of-n issuing authority. Ports the TS server to Rust and embeds the shared core."

[[bin]]
name = "scrai-server"
path = "src/main.rs"

# htop-style read-only admin dashboard over the server's state.db (SSH on the box).
[[bin]]
name = "scrai-admin"
path = "src/bin/scrai-admin.rs"

[[bin]]
name = "scrai-faucet"
path = "src/bin/scrai-faucet.rs"

[dependencies]
scrai-core = { path = "../core" }
# Embedded mixnet client — the server IS a Nym service provider (no public IP/DNS).
nym-sdk = "1.21"
# scrai-faucet: signs the testnet NYM transfer that pays a tester's $1 invoice (same
# crate family as nym-sdk, already in the lock file; bip39 comes re-exported from it).
nym-validator-client = "1.21"
nym-network-defaults = "1.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: chat signatures cover the client's canonical JSON body, so
# message key order must survive parse → re-serialize (core enables it too).
serde_json = { version = "1.0", features = ["preserve_order"] }
# Proxy chat requests to LLM providers (Groq/Gemini) over HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Load provider API keys from .env (GROQ_API_KEY, GEMINI_API_KEY).
dotenvy = "0.15"
# Chunked vision-image upload staging: random upload ids + base64 chunk decode.
rand = "0.8"
urlencoding = "2"
env_logger = "0.11"
base64 = "0.22"
# Durable session balances + double-spend records (bundled SQLite, no system dep).
rusqlite = { version = "0.32", features = ["bundled"] }
# scrai-admin: terminal dashboard (htop-style). Only used by that binary.
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
# pay.rs / chat.rs tests sign requests the way the real client does.
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"

[lib]
name = "scrai_server"
path = "src/lib.rs"
