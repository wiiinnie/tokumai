[package]
name = "scrai-server"
version.workspace = true
# three binaries live here (scrai-server, scrai-admin, scrai-faucet); plain `cargo run` = the server
default-run = "scrai-server"
edition = "2021"
description = "tokumai server — the mixnet service provider + t-of-n issuing authority. Ports the TS server to Rust and embeds the shared core."

[[bin]]
name = "scrai-server"
path = "src/main.rs"

# htop-style read-only admin dashboard over the server's state.db (SSH on the box).
[[bin]]
name = "scrai-faucet"
path = "src/bin/scrai-faucet.rs"

# The operator console — installed as `tokumai-admin`. A page on loopback, its own binary
# and not a route on the faucet: the faucet answers the internet and this must never be
# able to. The ratatui console it replaced was retired on 2026-09-09; `admin.rs` (the data
# layer they shared) stays.
[[bin]]
name = "scrai-adminweb"
path = "src/bin/scrai-adminweb.rs"

[dependencies]
scrai-core = { path = "../core" }
# Embedded mixnet client — the server IS a Nym service provider (no public IP/DNS).
nym-sdk = "1.21"
# scrai-faucet: signs the testnet NYM transfer that pays a tester's $1 invoice (same
# crate family as nym-sdk, already in the lock file; bip39 comes re-exported from it).
nym-validator-client = "1.21"
nym-network-defaults = "1.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: chat signatures cover the client's canonical JSON body, so
# message key order must survive parse → re-serialize (core enables it too).
serde_json = { version = "1.0", features = ["preserve_order"] }
# Proxy chat requests to LLM providers (Gemini/OpenAI) over HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Load provider API keys from .env (GEMINI_API_KEY, OPENAI_API_KEY).
dotenvy = "0.15"
# Chunked vision-image upload staging: random upload ids + base64 chunk decode.
rand = "0.8"
urlencoding = "2"
env_logger = "0.11"
base64 = "0.22"
# Durable session balances + double-spend records (bundled SQLite, no system dep).
rusqlite = { version = "0.32", features = ["bundled"] }
# openai.rs: the per-day safety identifier (sha256 hex).
sha2 = "0.10"
# pay.rs: the voucher fingerprint. A KEYED hash, so a leaked state.db is not a list of
# bearer codes waiting to be brute-forced — the code space is 2^60, which an unsalted
# sha256 hands to a GPU rig in a few months (audit 2026-09-08).
hmac = "0.12"
hex = "0.4"
# scrai-admin: terminal dashboard (htop-style). Only used by that binary.
ratatui = "0.28"
crossterm = "0.28"
x509-parser = { version = "0.16", features = ["verify"] }
ring = "0.17"

[dev-dependencies]
# the ecash testkit (see core/Cargo.toml) — only for tests, never in the shipped binary
scrai-core = { path = "../core", features = ["testkit"] }
# pay.rs / chat.rs tests sign requests the way the real client does.
ed25519-dalek = "2"

[lib]
name = "scrai_server"
path = "src/lib.rs"
