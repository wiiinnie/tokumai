[package]
name = "scrambleai"   # crate name is wired into gen/apple + gen/android (tauri checks it) — stays, like the scrai-* crates
version.workspace = true
description = "tokumai desktop"
authors = ["tokumai"]
license = ""
edition = "2021"
rust-version = "1.87.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Used for production builds AND when no devUrl is set (our static frontend).
# Without it, `tauri dev` cannot serve the bundled assets → blank window. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]
# Semantic privacy-guard layer: compiles the GLiNER engine (gline-rs → ort/ONNX
# Runtime) in src/detect.rs. OFF by default because it pulls a heavy native dep
# (ONNX Runtime) and lengthens the build. With it off, detect.rs returns a clear
# "not built" error and the guard falls back to its deterministic detectors.
# Turn on with `--features smart-guard` (or `tauri dev --features smart-guard`)
# once the model is in place, to build + test the semantic layer.
smart-guard = ["dep:gline-rs", "dep:orp"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# preserve_order so signed request bodies serialise key-for-key like the TS client.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
qrcode = "0.14"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Opens http(s) links in the system browser on iOS/Android (desktop keeps `open`/xdg-open).
tauri-plugin-opener = "2"

# --- crypto core (byte-compatible with the TS client, so the same scrai-server
#     verifies its accounts, sessions and ecash) ---
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
k256 = { version = "0.13", features = ["arithmetic"] }
# Wallet-at-rest encryption (H6): AES-256-GCM over the wallet JSON, keyed by a random
# data key held in the OS keychain (macOS Keychain / Windows Credential Manager /
# Linux keyutils via `keyring`). The mnemonic + bearer coconut purses are then
# unreadable from disk/backups without the OS-protected key.
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
# Embedded mixnet client — no external nym-client binary needed.
nym-sdk = "1.21"
# Shared crypto/protocol core (threshold ecash, quorum, federation protocol) —
# the SAME code the server uses. The client's withdraw/redeem flow wires into this.
scrai-core = { path = "../core" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures = "0.3"
# Direct (non-mixnet) fetch of the Nym directory to map gateway identity -> country.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# PDF text extraction in the Rust core (the privacy guard reads a PDF's text
# layer here, avoiding pdf.js's newer-JS requirements in the WKWebView).
pdf-extract = "0.9"

# --- semantic privacy-guard (optional, behind the `smart-guard` feature) -------
# GLiNER zero-shot NER for open-class sensitive data (names, addresses, tax IDs)
# that fixed-format detectors can't catch. gline-rs → ort → ONNX Runtime runs on
# all target platforms (mac/Linux/Win/iOS/Android). Kept optional so the default
# build stays light. See src/detect.rs.
gline-rs = { version = "1", optional = true }
orp = { version = "1", optional = true }

# Android: Nym's HTTP client (reqwest 0.13) verifies TLS through rustls-platform-verifier,
# which on Android must be handed a JNI env + app Context once at start-up — otherwise every
# TLS handshake to the Nym directory fails and the mixnet client never connects (two testers
# hit exactly that on 2026-08-30: stuck at "Connecting to tokumai server").
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = { version = "0.22", default-features = false }

# Native "save as…" dialog for downloading generated images (the webview can't).
# Desktop only — iOS saves to Photos, Android has no dialog backend in rfd.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15"

# iOS: generated images go straight to the Photos library, handover exports
# through the native share sheet (Files, AirDrop, …).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = [
  "UIImage", "UIImagePickerController", "UIActivityViewController",
  "UIViewController", "UIResponder", "UIView", "UIWindow", "UIApplication",
  "UIPopoverPresentationController", "UIPresentationController",
  # native image/camera picker (UIImagePickerControllerDelegate inherits UINavigationControllerDelegate)
  "UINavigationController", "UIScrollView",
  # H1: native, biometric-gated recovery-phrase reveal (seed never crosses into the webview),
  # with a Copy that puts the words on the pasteboard from native code — never via JS.
  "UIAlertController", "block2", "UIPasteboard",
] }
# H1: Face ID / Touch ID gate + Obj-C blocks for its async reply.
block2 = "0.6"
# App Store storefront (country) — decides which top-up UI iOS may show (guideline 3.1.1):
# US = link out, EU = link out under the external-purchase-link entitlement, rest = ID only.
objc2-store-kit = { version = "0.3", features = ["SKPaymentQueue", "SKStorefront"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }

# --- on-device OCR for the privacy guard (macOS + iOS via Apple Vision;
#     other platforms fall back to the bundled Tesseract-WASM frontend) ---
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSArray", "NSDictionary", "NSURL", "NSDate", "NSValue"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "VNError", "alloc", "std"] }
# Render scanned-PDF pages off-screen for OCR (CGPDFDocument → bitmap → CGImage).
objc2-core-graphics = { version = "0.3", features = ["CGDataProvider", "CGPDFDocument", "CGPDFPage", "CGContext", "CGColorSpace", "CGImage", "CGBitmapContext"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFData"] }
# Encode rendered PDF pages to PNG (for the redaction preview in the webview).
image = { version = "0.25", default-features = false, features = ["png"] }
