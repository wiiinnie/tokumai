name: scrambleai
options:
  bundleIdPrefix: com.tokumai.app
  deploymentTarget:
    iOS: "15.0"
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: tokumai
      PRODUCT_BUNDLE_IDENTIFIER: com.tokumai.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  scrambleai_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        buildPhase: none
      - path: scrambleai_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: scrambleai_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # Export compliance, answered once here instead of per build in App Store Connect:
        # standard algorithms only (Nym: X25519/ChaCha20/AES/Blake; wallet: AES-GCM) → exempt.
        ITSAppUsesNonExemptEncryption: false
        # Privacy usage descriptions MUST live here (not just in Info.plist) — xcodegen
        # regenerates Info.plist from project.yml, so a key only in the plist gets wiped and
        # the app crashes (TCC) the moment it touches the camera / photos / local network.
        NSCameraUsageDescription: "Scans a migration QR code to move your account to this device. The camera is used only while you scan; nothing is recorded or sent."
        NSPhotoLibraryAddUsageDescription: "Saves AI-generated images from your chats to your photo library. Nothing is ever read from it."
        NSLocalNetworkUsageDescription: "Development builds load the UI from the dev server on your Mac. Release builds never use the local network."
        NSFaceIDUsageDescription: "Face ID confirms it's you before your 24-word recovery phrase is shown on this device."
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.6.4
        CFBundleVersion: "0.6.5"
    entitlements:
      path: scrambleai_iOS/scrambleai_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # iPhone only for the first App Store submission: the layout is phone-first and
        # untested on iPad, and an iPad target makes 13" iPad screenshots mandatory. iPhone
        # apps still run on iPad in compatibility mode. Widen to "1,2" once the iPad layout
        # has been looked at.
        TARGETED_DEVICE_FAMILY: "1"
        # StoreKitShim.swift (App Store purchases) — Swift 5 mode; the shim is not Swift-6 strict.
        SWIFT_VERSION: "5.0"
        # Signing baked into project.yml so `xcodegen generate` / `tauri ios build` keep it
        # (setting the team only in the Xcode UI gets wiped on the next regeneration).
        DEVELOPMENT_TEAM: T23Z4LDMGV
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64, x86_64]
        VALID_ARCHS: arm64  x86_64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Vision.framework
      - sdk: CoreFoundation.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: StoreKit.framework
    preBuildScripts:
      - script: |
          # Xcode's build env finds the old Intel node (/usr/local/bin, x86_64) first,
          # whose @tauri-apps/cli looks for cli-darwin-x64 (not installed) → MODULE_NOT_FOUND.
          # Force the arm64 Homebrew node (+ cargo) so the native CLI binary resolves.
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a