[package]
name = "tokumai-server"
edition.workspace = true
version.workspace = true
description = "What runs the enclave core: its own Nym client (the address the app reaches), the renewal tick, and the development stand-ins."

[dependencies]
tokumai-core = { path = "../core" }
tokumai-attest = { path = "../attest" }
tokumai-proto = { path = "../proto" }
tokumai-enclave = { path = "../enclave" }
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
tokio.workspace = true
# The mixnet client, inside the enclave: the operator's host only relays Sphinx packets.
tokumai-client = { path = "../client" }
nym-sdk = "1.21"
# tokumai-dev-credit opens the dev app's profile.
aes-gcm = "0.10"
# tokumai-seal: the secrets under their own key, only that key goes to KMS.
chacha20poly1305.workspace = true
tokumai-egress = { path = "../egress" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# The Nitro enclave binary: the Nitro Secure Module as attester (Linux only).
nitro = ["tokumai-attest/nsm"]
# Accept App Store SANDBOX purchases. A separate image with its own PCR0, on purpose:
# a production image can then never be talked into taking a sandbox receipt, and the
# measurement says which of the two is running.
apple-sandbox = ["tokumai-enclave/apple-sandbox"]
# DEVELOPMENT ONLY, and a separate image again: one line per request, no account, no
# content. See tokumai-enclave's own note.
trace-requests = ["tokumai-enclave/trace-requests"]

[[bin]]
name = "tokumai-enclave-nitro"
required-features = ["nitro"]
