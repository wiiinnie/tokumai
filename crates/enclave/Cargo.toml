[package]
name = "tokumai-enclave"
edition.workspace = true
version.workspace = true
description = "The tokumai server core. Runs inside an attested enclave: accounts, balances, billing and the relay to the model providers, none of it visible to the operator."

[dependencies]
tokumai-core = { path = "../core" }
tokumai-attest = { path = "../attest" }
tokumai-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
rand.workspace = true
rusqlite.workspace = true
tokio.workspace = true
reqwest.workspace = true
x509-parser.workspace = true
ring.workspace = true
# KMS from inside the enclave: the request is signed here (hmac), the answer comes as CMS
# (the content key to our RSA key, the content under AES-CBC).
hmac = "0.12"
# Content-MD5 on the witness's writes: S3 asks for it on a bucket with Object Lock.
md-5 = "0.10"
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
webp = { version = "0.3.1", default-features = false, features = ["img"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[features]
# Accept App Store sandbox purchases in a release image (testnet). See policy::APPLE_SANDBOX.
apple-sandbox = []
# DEVELOPMENT ONLY. One line per request — the OPERATION, the result and how long it took,
# with no account and no content — so that "it hangs" can be told apart from "it never
# arrived" and from "it was answered and the answer was lost". It is still a trace of use,
# so it belongs in no image that serves anybody: a production image is built without it, and
# PCR0 says which is running. Comes out before mainnet, with the sandbox feature — the list
# is in docs/terms-notes.md.
trace-requests = []
