# Cargo workspace: one shared `core` crate, the Tauri desktop client (src-tauri),
# and the Rust server binary (server) — client and server share the SAME crypto core.
[workspace]
resolver = "2"
members = ["core", "src-tauri", "server", "ledger", "mixbench", "loadtest"]

# ONE version for the whole repo: the app (package.json + tauri.conf.json), the server and
# the shared crates move together and are tagged together (v0.4.5, …). Every member crate
# inherits it via `version.workspace = true`; the server reports it at boot, in the models
# reply (`serverVersion`) and in scrai-admin. Bump ALL copies with scripts/bump-version.sh —
# never edit one by hand.
[workspace.package]
version = "0.5.9"

# opt-level 3 + aggressive inlining merged Nym's async mixnet frames large enough to
# overflow iOS's small thread stacks at gateway connect (SIGSEGV, release-only; debug
# and macOS were fine). opt-level 1 keeps most optimization but reins in the inlining
# that produced the oversized stack frames. See memory: scrambleai-ios-embedded-release-crash.
[profile.release]
opt-level = 1
