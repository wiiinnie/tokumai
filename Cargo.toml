[workspace]
members = [
    "cli",
    "server", 
    "directory",
    "shared"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nym-sdk = { path = "../nym_repo/sdk/rust/nym-sdk" }
