[workspace]
resolver = "2"
members = ["crates/core", "crates/attest", "crates/proto", "crates/enclave", "crates/client", "crates/server", "crates/egress", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
bip39 = { version = "2", features = ["rand"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
x509-parser = { version = "0.16", features = ["verify"] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# The Nym gateway client, reaching its gateway through the enclave's egress proxy when
# TOKUMAI_EGRESS_PROXY is set (vendor/README.md).
[patch.crates-io]
nym-gateway-client = { path = "vendor/nym-gateway-client" }
