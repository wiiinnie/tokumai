# scrai-loadtest — capacity / latency harness for ONE scrai-server over the REAL mixnet.
#
# Spins up N independent Nym clients in one process (one per simulated user), optionally
# funds each one the way the app does (fake-payments server only: invoice → entitlement →
# coconut withdraw → redeem), then fires ping / models / signed chat requests and records
# per-request latency, errors and timeouts. See docs/load-testing.md. Not shipped.
[package]
name = "scrai-loadtest"
version.workspace = true
edition = "2021"
publish = false
description = "tokumai load-test harness — N simulated users against one scrai-server over the mixnet"

[[bin]]
name = "scrai-loadtest"
path = "src/main.rs"

[dependencies]
scrai-core = { path = "../core" }
nym-sdk = "1.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: the chat signature covers the canonical body {model, messages, maxTokens}
# in exactly that key order (same as core/server/app).
serde_json = { version = "1.0", features = ["preserve_order"] }
# Account + session signing, byte-compatible with src-tauri/src/account.rs.
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
env_logger = "0.11"
log = "0.4"
