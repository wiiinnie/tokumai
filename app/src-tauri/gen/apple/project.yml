# Generated by `tauri ios init`, then hand-edited — and the hand edits are the point.
# `xcodegen generate` and `tauri ios build` both read this file, so anything set only in
# Xcode's UI is wiped on the next regeneration. A fresh `tauri ios init` would overwrite
# this file: carry these blocks back if that ever happens. They come from the first
# generation's project (08_scrambleai-tokumai), where each was learned the hard way.
name: tokumai-app
options:
  bundleIdPrefix: com.tokumai.app
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: tokumai
      PRODUCT_BUNDLE_IDENTIFIER: com.tokumai.app
      DEVELOPMENT_TEAM: T23Z4LDMGV
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  tokumai-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # buildPhase: none — Externals holds libapp.a per architecture. Without this it is
      # copied INTO the bundle, and App Store Connect rejects the upload for carrying a
      # static library it cannot sign.
      - path: Externals
        buildPhase: none
      - path: tokumai-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: tokumai-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # We ship no encryption of our own beyond what Apple exempts (TLS and the platform's
        # own primitives). Without this every upload asks the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Every string somebody actually reads in a permission prompt. Apple rejects a build
        # that asks without explaining, and a vague sentence here reads as evasion.
        NSCameraUsageDescription: "Scans a migration QR code to move your account to this device. The camera is used only while you scan; nothing is recorded or sent."
        NSPhotoLibraryAddUsageDescription: "Saves AI-generated images from your chats to your photo library. Nothing is ever read from it."
        NSLocalNetworkUsageDescription: "Development builds load the UI from the dev server on your Mac. Release builds never use the local network."
        NSFaceIDUsageDescription: "Face ID confirms it's you before your 24-word recovery phrase is shown on this device."
    entitlements:
      path: tokumai-app_iOS/tokumai-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # iPhone only for the first submission: the layout is phone-first and untested on
        # iPad, and an iPad target makes 13" iPad screenshots mandatory. iPhone apps still
        # run on iPad in compatibility mode. Widen to "1,2" once iPad has been looked at.
        TARGETED_DEVICE_FAMILY: "1"
        # StoreKitShim.swift (App Store purchases) comes in stage 2 — Swift 5 mode, because
        # the shim is not Swift-6 strict. Set now, so this setting is not the thing that
        # breaks that build.
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      # Vision: the OCR path shared with macOS (ocr.rs). CoreFoundation: the Keychain and
      # security-framework calls. StoreKit: stage 2, linked now so the project does not have
      # to be regenerated for it.
      - sdk: Vision.framework
      - sdk: CoreFoundation.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: StoreKit.framework
    preBuildScripts:
      # The PATH line is not decoration: Xcode runs build scripts with a minimal PATH, so
      # without it neither npm nor cargo is found — the build then fails inside Xcode while
      # working from a terminal, which is a confusing afternoon.
      - script: |
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
