[package]
name = "tokumai-app"
edition.workspace = true
version.workspace = true
description = "tokumai, the app (desktop)"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds, and whenever there is no devUrl: the bundled frontend. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]
# The semantic privacy guard (GLiNER on ONNX Runtime) — heavy, off by default.
smart-guard = ["dep:gline-rs", "dep:orp"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# build.rs reads dev-data/probe.json, so a build for a phone carries the enclave it was
# built against — a device cannot read the developing machine's dev-data at runtime.
serde_json = "1"

[dependencies]
tokumai-core = { path = "../../crates/core" }
tokumai-attest = { path = "../../crates/attest" }
tokumai-proto = { path = "../../crates/proto" }
tokumai-client = { path = "../../crates/client" }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
log = "0.4"
tokio.workspace = true
rand.workspace = true
hex.workspace = true
base64.workspace = true
qrcode = "0.14"
# The profile and the chat vault at rest: AES-256-GCM, key in the OS keychain.
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
# The privacy guard reads a PDF's text layer on the device.
pdf-extract = "0.9"
gline-rs = { version = "1", optional = true }
orp = { version = "1", optional = true }

# --- Android: TLS through the system trust store ---
# nym-http-api-client → reqwest verifies TLS with rustls-platform-verifier, which on Android
# must be initialised with a JNI env + Context (lib.rs::init_android_tls_verifier). Without
# it the app hangs at "Connecting to tokumai server" (the directory fetch never completes).
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni = { version = "0.22", default-features = false }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15"

# --- iOS: what a phone has and a desktop does not ---
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = [
  "UIImage", "UIImagePickerController", "UIActivityViewController",
  "UIViewController", "UIResponder", "UIView", "UIWindow", "UIApplication",
  "UIPopoverPresentationController", "UIPresentationController",
  # The picker's delegate inherits UINavigationControllerDelegate.
  "UINavigationController", "UIScrollView",
  # The recovery phrase is shown and copied by NATIVE code, so the 24 words never enter
  # the webview: a script that got into the page cannot read what was never there.
  "UIAlertController", "block2", "UIPasteboard",
] }
block2 = "0.6"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
objc2-photos = { version = "0.3", features = ["PHPhotoLibrary", "PHAssetChangeRequest", "PHAssetCreationRequest", "PHChangeRequest", "PhotosTypes", "block2", "PHObject", "PHAsset"] }

# On-device OCR for the privacy guard (Apple Vision); elsewhere the page falls back to the
# bundled Tesseract.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSArray", "NSDictionary", "NSURL", "NSDate", "NSValue", "NSError"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "VNError", "alloc", "std", "objc2-image-io"] }
objc2-image-io = { version = "0.3", features = ["CGImageProperties"] }
objc2-core-graphics = { version = "0.3", features = ["CGDataProvider", "CGPDFDocument", "CGPDFPage", "CGContext", "CGColorSpace", "CGImage", "CGBitmapContext"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFData"] }
image = { version = "0.25", default-features = false, features = ["png"] }
