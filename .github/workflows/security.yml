name: security

# Static security scan on every push/PR: Semgrep (public packs + .semgrep/ project rules,
# incl. intraprocedural taint for the webview) and cargo-audit. Fully offline apart from
# fetching the public rule packs and the RustSec advisory DB — no Semgrep login, no upload.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install semgrep + cargo-audit
        run: |
          python3 -m pip install --user semgrep==1.174.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --locked
      - name: Scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: scripts/semgrep.sh --json semgrep-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-out
