# Build the Windows (x86_64) desktop app on a native Windows runner. Produces an NSIS
# installer (.exe) you can download from the run's "Artifacts", or that gets attached
# to a tag release. WebView2 (the Edge runtime every Windows 10/11 has) is the webview;
# the installer fetches the bootstrapper if a machine lacks it.
#
# The build is NOT code-signed (no certificate yet): SmartScreen shows "Windows
# protected your PC" on first launch — the site says so, like the macOS Gatekeeper note.
#
# Trigger it manually (Actions tab → "Build Windows (x86_64)" → Run workflow) or by
# pushing a version tag (git tag v0.1.2 && git push --tags).
name: Build Windows (x86_64)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build installer
        run: cargo tauri build --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrambleai-windows-x86_64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          # A build artifact is worth keeping until it has been downloaded and published,
          # not for the 90 days GitHub keeps it by default. 19 Linux runs at ~144 MB had
          # filled the account's Actions storage to 90% by 2026-09-08 — every one of them
          # a superseded copy of a file already on the download site.
          retention-days: 7
