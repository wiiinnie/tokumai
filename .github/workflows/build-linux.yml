# Build the Linux (x86_64) desktop app on a native Ubuntu runner — much faster than
# the emulated local Docker build, and free. Produces an AppImage + .deb you can
# download from the run's "Artifacts", or that get attached to a tag release.
#
# Trigger it manually (Actions tab → "Build Linux (x86_64)" → Run workflow) or by
# pushing a version tag (git tag v0.1.2 && git push --tags).
name: Build Linux (x86_64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft release (tag) to attach the bundles to — release assets do not count against the Actions storage quota, artifacts do"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build bundles
        run: cargo tauri build --bundles appimage,deb

      # Second way out: attach the bundles to a draft release when a tag is given. The
      # artifact upload below fails for hours once the account's storage quota is hit
      # (2026-09-12: "Artifact storage quota has been hit", recalculated every 6-12 h),
      # while release assets are not counted at all.
      - name: Attach to the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # A DRAFT release cannot be addressed by its tag — GitHub gives it a placeholder
        # name until it is published, so `gh release upload <tag>` answers "release not
        # found" and takes the artifact fallback below down with it (2026-09-15: both
        # platforms built for half an hour and the bundles were lost with the runners).
        # So: create the release if it is missing, published, and upload into it.
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "tokumai $RELEASE_TAG" --notes "Bundles attached by CI."
          gh release upload "$RELEASE_TAG" target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb --clobber

      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrambleai-linux-x86_64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          # A build artifact is worth keeping until it has been downloaded and published,
          # not for the 90 days GitHub keeps it by default. 19 Linux runs at ~144 MB had
          # filled the account's Actions storage to 90% by 2026-09-08 — every one of them
          # a superseded copy of a file already on the download site.
          retention-days: 3
